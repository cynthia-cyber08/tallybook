name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs on every PR alongside lint/build/test, as its own required check.
  # Scans only the lines a PR ADDS, for the Stellar Wave campaign's own TTPs
  # and for broader classes this org has not seen: credential harvesting,
  # wallet and seed theft, reverse shells, persistence, anti-analysis,
  # obfuscation and dependency redirection.
  #
  # CRITICAL fails the build. REVIEW prints for a human and does not --
  # legitimate work here touches CI and opens sockets in tests, and a gate
  # that cries wolf is a gate somebody switches off. Verified against 30 real
  # merges on this repo with zero false CRITICALs.
  malware-audit:
    name: malware-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove the detection rules still fire
        run: python3 scripts/audit-pr-malware.py --selftest

      - name: Audit the lines this PR adds
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "auditing $BASE..HEAD"
          python3 scripts/audit-pr-malware.py --ci "$BASE..HEAD"

  build-vet-staticcheck-test:
    runs-on: ubuntu-latest

    # Every package's own tests connect directly to
    # postgres://tallybook:tallybook@localhost:5433/tallybook (§8:
    # "Integration tests against real Postgres in Docker, not mocks") —
    # the same credentials and port docker-compose.yml uses for local
    # dev, hardcoded per-package rather than read from an env var. This
    # service block has to match that exactly, not just be "a postgres".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tallybook
          POSTGRES_PASSWORD: tallybook
          POSTGRES_DB: tallybook
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tallybook -d tallybook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # full history so the PR malware audit can diff against the base
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...

      # golangci-lint runs errorlint only (bodyclose found 0 findings on this
      # codebase). staticcheck is not duplicated here; it has its own step above.
      # Pinned to match the version evaluated against this tree; bump .golangci.yml
      # and this line together.
      - name: golangci-lint
        run: |
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz | tar -xz -C $(go env GOPATH)/bin --strip-components=1 golangci-lint-2.15.0-linux-amd64/golangci-lint
          golangci-lint run ./...

      # govulncheck gates the build: it is clean as of the toolchain and
      # golang.org/x/text bumps in this commit, so any new finding is a real
      # regression worth stopping for.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      # gosec reports but does NOT gate yet. It currently finds 31 issues, none
      # of which is a new defect:
      #   G115 x22  integer conversions, needs per-site triage -- some are
      #             genuinely bounded, some want an explicit check
      #   G101 x4   false positives: the env-var NAME constants in
      #             internal/config (TB_OPERATOR_SECRET et al) and a SQL string
      #   G112 x3   real, and already tracked by #13 (http.Server timeouts)
      #   G404 x1   math/rand for retry jitter, which is not a crypto use
      #   G304 x1   reading TB_OPERATOR_SECRET_PATH, which is the documented
      #             behaviour of that variable (section 7)
      # Flip continue-on-error off once those are triaged; gating on it today
      # would mean excluding every rule that fires, which teaches nothing.
      - name: gosec
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec ./...

      - name: go build
        run: go build ./...

      - name: Bounded fuzz smoke tests
        run: |
          go test ./internal/stellar -run='^$' -fuzz=FuzzDecodeEvents -fuzztime=2s
          go test ./internal/stellar -run='^$' -fuzz=FuzzDecodeScValHelpers -fuzztime=2s
          go test ./internal/meter -run='^$' -fuzz=FuzzParseSchedule -fuzztime=2s
          go test ./internal/merkle -run='^$' -fuzz=FuzzBuildTreeProofAgreement -fuzztime=2s
          go test ./internal/store -run='^$' -fuzz=FuzzParseMigrations -fuzztime=2s

      # Assert CLAUDE.md §8: "No panics outside main startup validation.
      # A library function returns an error." Any panic( in non-test code
      # under internal/ is a violation; the only allowed site is main.
      - name: assert internal/ is panic-free
        run: |
          if grep -rn --include='*.go' --exclude='*_test.go' 'panic(' internal/; then
            echo "Found panic() in non-test code under internal/ — CLAUDE.md §8 forbids panics outside main startup validation"
            exit 1
          fi

      - name: go test
        run: make test-ci
